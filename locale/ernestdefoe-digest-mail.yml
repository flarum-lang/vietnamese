      tbl_r1_size: '100–500 thành viên'
      tbl_r1_strategy: 'Một tiến trình xử lý, chế độ một giờ duy nhất — toàn bộ người đăng ký được đẩy đi trong một lượt'
      tbl_r2_size: 500–2.000
      tbl_r2_strategy: 'Một tiến trình xử lý, chế độ một giờ duy nhất hoặc khung giờ ngắn'
