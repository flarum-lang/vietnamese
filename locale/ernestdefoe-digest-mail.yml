    settings:
      enable_awards_help: 'Hiển thị các giải thưởng đang diễn ra và sắp tới trong email tổng hợp. Yêu cầu huseyinfiliz/awards.'
      enable_awards_label: 'Giải thưởng'
      enable_picks_help: 'Hiển thị các trận sắp diễn ra, kết quả gần đây và bảng xếp hạng dự đoán trong bản tin. Yêu cầu ernestdefoe/picks.'
      enable_picks_label: 'CFB Picks — bật mục này'
      featured_discussion_help: 'Nhập ID thảo luận để ghim nó làm thảo luận nổi bật ở đầu mọi email tổng hợp. Để trống nếu không muốn hiển thị thảo luận nổi bật.'
      featured_discussion_label: 'ID thảo luận nổi bật'
      hot_recency_weight_help: 'Độ mới ảnh hưởng bao nhiêu đến điểm sôi nổi. Cao hơn = bài viết mới được tính điểm cao hơn. Đặt 0 để chỉ xếp hạng theo số lượt trả lời.'
      hot_recency_weight_label: 'Điểm sôi nổi — trọng số độ mới'
      hot_reply_weight_help: 'Mỗi lượt trả lời đóng góp bao nhiêu vào điểm sôi nổi của thảo luận. Cao hơn = thiên về số lượt trả lời.'
      hot_reply_weight_label: 'Điểm sôi nổi — trọng số trả lời'
      limit_badges_help: 'Số lượng tối đa người vừa nhận huy hiệu được liệt kê trong email tổng hợp (mặc định 5, tối thiểu 3). Yêu cầu fof/badges.'
      limit_badges_label: 'Huy hiệu — số người nhận gần đây tối đa'
      limit_favorites_help: 'Số lượng thảo luận yêu thích tối đa hiển thị, xếp hạng theo lượt thích/cảm xúc trong kỳ (mặc định 6, tối thiểu 3). Đặt 0 để tắt. Sử dụng fof/reactions nếu được bật, nếu không sẽ dùng flarum/likes.'
      limit_favorites_label: 'Thảo luận yêu thích — số mục tối đa'
      limit_gamepedia_help: 'Số lượng trò chơi tối đa hiển thị trong các phần Được thảo luận nhiều nhất và Mới thêm (mặc định 5, tối thiểu 3). Yêu cầu huseyinfiliz/gamepedia.'
      limit_gamepedia_label: 'Gamepedia — số trò chơi tối đa mỗi phần'
      limit_hot_help: 'Số lượng thảo luận sôi nổi (hot) tối đa được đưa vào mỗi email tổng hợp.'
      limit_hot_label: 'Thảo luận sôi nổi — số mục tối đa'
      limit_leaderboard_help: 'Số mục bảng xếp hạng hiển thị trong email tổng hợp (mặc định 10, tối thiểu 3). Yêu cầu huseyinfiliz-leaderboard.'
      limit_leaderboard_label: 'Số mục bảng xếp hạng'
      limit_members_help: 'Số lượng thành viên mới tối đa hiển thị trong mỗi email tổng hợp.'
      limit_members_label: 'Thành viên mới — số mục tối đa'
      limit_new_help: 'Số lượng thảo luận mới tối đa được đưa vào mỗi email tổng hợp.'
      limit_new_label: 'Thảo luận mới — số mục tối đa'
      limit_pickem_help: 'Số lượng tối đa trận đấu sắp diễn ra, kết quả gần đây và mục bảng xếp hạng hiển thị trong email tổng hợp (mặc định 5, tối thiểu 3). Yêu cầu huseyinfiliz/pickem.'
      limit_pickem_label: 'Pick''em — số mục tối đa mỗi phần'
      limit_picks_help: 'Số trận sắp diễn ra, kết quả gần đây và mục trong bảng xếp hạng tối đa được hiển thị trong bản tin (mặc định 5, tối thiểu 3). Yêu cầu ernestdefoe/picks.'
      limit_picks_label: 'CFB Picks — số mục tối đa mỗi phần'
      limit_resofire_gamepedia_help: 'Số trò chơi tối đa hiển thị trong các mục Được bàn luận nhiều nhất, Mới thêm và Thể loại nổi bật (mặc định 5, tối thiểu 3). Yêu cầu resofire/gamepedia.'
      limit_resofire_gamepedia_label: 'Resofire Gamepedia — số trò chơi tối đa mỗi phần'
      limit_unread_help: 'Số lượng thảo luận chưa đọc tối đa hiển thị cho mỗi người nhận.'
      limit_unread_label: 'Thảo luận chưa đọc — số mục tối đa'
      monthly_day_help: 'Ngày trong tháng mà email tổng hợp hằng tháng được gửi. Giới hạn ở 28 để luôn hợp lệ với tháng Hai.'
      monthly_day_label: 'Email tổng hợp hằng tháng — ngày gửi'
      picks_leaderboard_scope_alltime: 'Mọi thời điểm'
      picks_leaderboard_scope_help: 'Bảng xếp hạng nào sẽ hiển thị: tuần vừa kết thúc gần nhất, mùa giải hiện tại, hay xếp hạng mọi thời điểm.'
      picks_leaderboard_scope_label: 'CFB Picks — phạm vi bảng xếp hạng'
      picks_leaderboard_scope_season: 'Mùa giải hiện tại'
      picks_leaderboard_scope_week: 'Tuần gần nhất'
      queue_chunk_size_help: 'Số người dùng được đưa vào hàng đợi mỗi phút của trình lên lịch (mặc định 200, tối thiểu 50, tối đa 10000). Diễn đàn nhỏ: 200–500. Diễn đàn lớn trên máy chủ riêng: 1000–10000. Giá trị cao hơn hoàn thành nhanh hơn nhưng tốn nhiều bộ nhớ hơn mỗi chu kỳ.'
      queue_chunk_size_label: 'Kích thước lô hàng đợi'
      queue_delay_help: 'Số giây trước khi các tác vụ trong hàng đợi sẵn sàng cho worker xử lý (mặc định 0). Ở chế độ khung giờ thì hiếm khi cần — bản thân khung giờ đã phân tán tải theo thời gian. Chỉ hữu ích khi dùng lệnh hai giai đoạn digest:enqueue trên các diễn đàn rất lớn.'
      queue_delay_label: 'Độ trễ tác vụ (giây)'
      queue_name_help: 'Hàng đợi mà các tác vụ email tổng hợp được đẩy vào. Phải trùng với tham số --queue trong cron queue:work của bạn. Mặc định: digest.'
      queue_name_label: 'Tên hàng đợi'
      queue_tries_help: 'Số lần một tác vụ gửi email tổng hợp bị lỗi sẽ được thử lại trước khi chuyển vào bảng tác vụ thất bại (mặc định 3). Việc thử lại dùng backoff lũy thừa: 30 giây, 60 giây, 120 giây. Lưu ý: nếu bạn đã cài blomstra/database-queue, nó có cài đặt Retries riêng — giá trị thấp hơn trong hai giá trị sẽ được áp dụng. Khuyến nghị đặt cả hai cài đặt cùng một giá trị.'
      queue_tries_label: 'Số lần thử lại tối đa'
      saved: 'Đã lưu'
      send_hour_help: 'Thời điểm trong ngày mà email tổng hợp bắt đầu được gửi.'
      send_hour_label: 'Giờ gửi'
      send_window_end_help: 'Để giống thời gian bắt đầu nếu muốn gửi tất cả email cùng lúc. Đặt muộn hơn để dàn trải việc gửi trong vài giờ — khuyến nghị cho diễn đàn lớn. Ví dụ: bắt đầu lúc 2 giờ sáng và kết thúc lúc 4 giờ sáng nghĩa là email được gửi dần từ 2 đến 4 giờ sáng.'
      send_window_end_label: 'Thời gian gửi — kết thúc (tùy chọn)'
      send_window_start_help: 'Thời điểm trong ngày mà email tổng hợp bắt đầu được gửi. Hãy chọn khoảng thời gian yên ắng khi diễn đàn của bạn ít hoạt động — thường là đêm khuya hoặc sáng sớm.'
      send_window_start_label: 'Thời gian gửi'
      timezone_help: 'Hãy chọn múi giờ của chính bạn — không phải của máy chủ. Thời gian gửi bạn đặt bên dưới sẽ kích hoạt vào giờ đó theo múi giờ bạn chọn tại đây. Ví dụ: nếu bạn ở Chicago và muốn email được gửi lúc 8 giờ sáng giờ của bạn, hãy chọn Central Time và đặt thời gian gửi là 8 giờ sáng.'
      timezone_label: 'Múi giờ của bạn'
      weekly_day_help: 'Ngày trong tuần mà email tổng hợp hằng tuần được gửi.'
      weekly_day_label: 'Email tổng hợp hằng tuần — ngày gửi'
