      recommended_intro: 'Đây là các mức khuyến nghị để bắt đầu. Hiệu năng thực tế phụ thuộc vào phần cứng máy chủ, tốc độ phản hồi của nhà cung cấp dịch vụ mail và số người dùng đã đăng ký nhận bản tin. Hãy luôn theo dõi độ dài hàng đợi và điều chỉnh cho phù hợp.'
      recommended_tip: 'Với các diễn đàn trên 50.000 thành viên, hãy cân nhắc chuyển từ trình điều khiển hàng đợi database có sẵn sang Redis hoặc Valkey kèm Horizon và Supervisor để có thông lượng cao hơn nhiều và khả năng theo dõi theo thời gian thực. Hãy chuyển sang tab Redis / Valkey trong mục Thiết lập cron phía trên để xem hướng dẫn đầy đủ. Lịch sử gửi được giữ lại tự động: 30 mục theo ngày, 52 mục theo tuần, 24 mục theo tháng.'
      redis_how_1a: 'Bộ lập lịch chạy mỗi phút một lần qua cron. Khi tới giờ gửi bạn đã cấu hình, '
      redis_how_1b: ' sẽ đẩy các tác vụ sang Redis. Một tiến trình xử lý chạy bằng cron mỗi phút sẽ kết nối tới Redis và xử lý tác vụ trong tối đa 55 giây rồi thoát gọn gàng. Cách này không cần tiến trình chạy liên tục hay Supervisor.'
      redis_how_title: 'Cách hoạt động'
      redis_installed_1: 'Tiện ích này không hướng dẫn cài đặt Redis hay Valkey. Khi máy chủ Redis hoặc Valkey của bạn đã chạy và '
      redis_installed_2: ' đã được cài và cấu hình, hãy chọn cách chạy tiến trình xử lý bên dưới.'
      redis_installed_title: 'Redis / Valkey phải được cài sẵn và đang chạy trên máy chủ của bạn'
      redis_upgrade_horizon_1: 'Với các diễn đàn đông người, Horizon mang lại những tiến trình xử lý chạy liên tục, khả năng theo dõi hàng đợi theo thời gian thực, tự động mở rộng và một bảng điều khiển có sẵn. Hãy chuyển sang tab '
      redis_upgrade_horizon_2: ' phía trên để xem hướng dẫn thiết lập đầy đủ.'
      redis_upgrade_horizon_title: 'Hãy cân nhắc nâng cấp lên Horizon + Supervisor'
      redis_worker_flags_2: ' dừng tiến trình xử lý gọn gàng trước khi cron chạy lần kế tiếp. Tiến trình kết nối tới Redis qua '
      redis_worker_flags_3: ' và xử lý tác vụ đủ 55 giây trước khi thoát.'
      retries_db_body: 'Nếu một tác vụ thất bại, ví dụ khi máy chủ mail của bạn tạm thời không khả dụng, nó sẽ tự động được thử lại tối đa số lần đã cấu hình ở mục Cài đặt hàng đợi phía trên. Các lần thử lại giãn cách theo cấp số nhân: 30 giây, rồi 60 giây, rồi 120 giây giữa các lần.'
      retries_failed_1: 'Những tác vụ thất bại vĩnh viễn sẽ nằm trong bảng '
      retries_failed_2: ' của bạn. Bạn có thể xem và chạy lại chúng bằng '
      retries_failed_redis_1: 'Những tác vụ thất bại vĩnh viễn sẽ nằm trong bảng '
      retries_failed_redis_2: ' của bạn. Hãy xem và chạy lại chúng bằng '
      retries_redis_body: 'Nếu một tác vụ thất bại, nó sẽ tự động được thử lại tối đa số lần đã cấu hình ở mục Cài đặt hàng đợi phía trên, với thời gian chờ tăng theo cấp số nhân: 30 giây, rồi 60 giây, rồi 120 giây giữa các lần.'
      retries_title: 'Thử lại và thời gian chờ'
      send_window_db_1: 'Thay vì gửi toàn bộ email trong một giờ duy nhất, bạn có thể đặt một khung giờ gửi, ví dụ từ 1 giờ đến 5 giờ sáng, ở tab Cài đặt. Bộ lập lịch sẽ đẩy một nhóm người đăng ký mỗi phút trong suốt khung giờ đó, giúp tải cơ sở dữ liệu trải đều theo thời gian thay vì dồn hết một lúc.'
      send_window_db_2: 'Tiện ích tự theo dõi tiến độ của mình và dừng lại khi mọi người đăng ký đã được xử lý. Bạn không cần thêm dòng cron nào khác.'
      send_window_horizon_1: 'Hãy đặt một khung giờ gửi ở tab Cài đặt để trải việc gửi ra nhiều giờ. Bộ lập lịch đẩy một nhóm mỗi phút trong suốt khung giờ đó, giữ tải máy chủ thấp và ổn định. Các tiến trình Horizon sẽ xử lý song song từng nhóm ngay khi nhóm đó tới.'
      send_window_redis_1: 'Hãy đặt một khung giờ gửi ở tab Cài đặt để trải việc gửi ra nhiều giờ. Bộ lập lịch đẩy một nhóm mỗi phút trong suốt khung giờ đó, giữ tải máy chủ thấp và ổn định.'
      send_window_redis_2: 'Tiện ích tự theo dõi tiến độ và dừng lại khi mọi người đăng ký đã được xử lý.'
      send_window_title: 'Khung giờ gửi'
      sync_limit_200: ' — thường xuyên quá hạn, cạn bộ nhớ trên các gói VPS thông thường'
      sync_limit_200_label: 'Trên 200 người đăng ký'
      sync_limit_500: ' — gần như không dùng được; việc đăng bài sẽ lỗi hoặc treo'
      sync_limit_500_label: 'Trên 500 người đăng ký'
      sync_limit_50_200: ' — trang phản hồi chậm, thỉnh thoảng bị quá hạn'
      sync_limit_50_200_label: '50–200 người đăng ký'
      sync_limit_under50: ' — sync vẫn ổn, phần lớn máy chủ xử lý được mà không gặp vấn đề'
      sync_limit_under50_label: 'Dưới khoảng 50 người đăng ký'
      sync_limits_title: 'Sync có giới hạn — hãy biết khi nào cần nâng cấp'
      sync_no_setup_1a: 'Trình điều khiển '
      sync_no_setup_1b: ' mặc định của Flarum xử lý các tác vụ ngay trong yêu cầu web. Bạn không cần tiến trình xử lý hàng đợi, không cần Supervisor và không cần nền tảng hàng đợi nào. Dòng cron của bộ lập lịch bên dưới là thứ duy nhất cần có.'
      sync_no_setup_2a: 'Khi bộ lập lịch chạy vào giờ gửi bạn đã cấu hình, '
      sync_no_setup_2b: ' sẽ chạy, dựng từng email và gửi thẳng trong cùng tiến trình đó.'
      sync_no_setup_title: 'Chế độ Sync không cần thiết lập tiến trình xử lý'
      sync_switch_db_1: 'Sau đó hãy chuyển sang tab '
      sync_switch_db_2: ' phía trên để xem cách thiết lập cron đúng.'
      sync_upgrade_prompt: 'Khi chạm tới các giới hạn đó, hãy chuyển sang trình điều khiển hàng đợi database có sẵn của Flarum, không cần cài thêm tiện ích. Hãy thêm dòng này vào '
      tbl_head_chunk_size: 'Kích thước mỗi nhóm'
      tbl_head_cron_strategy: 'Chiến lược cron'
      tbl_head_forum_size: 'Quy mô diễn đàn'
